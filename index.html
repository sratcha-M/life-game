<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f6a5c0'/%3E%3Cpath d='M20 40c4 6 20 6 24 0' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='26' r='4' fill='%23fff'/%3E%3Ccircle cx='40' cy='26' r='4' fill='%23fff'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="เกม Visual Novel ใช้ชีวิตตั้งแต่เกิดจนแก่ ทุกทางเลือกกำหนดว่าคุณจะเติบโตเป็นใคร" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet" />
    <title>เส้นทางชีวิต</title>
  </head>
  <body>
    <div id="root">
      <!-- หน้าโหลด: แสดงทันทีก่อน JS มาถึง (React จะแทนที่เองเมื่อพร้อม) -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#ffe3ec,#fff6e9);font-family:Mitr,Sarabun,sans-serif;color:#5a3443">
        <div style="font-size:56px;animation:lp-bob 1.2s ease-in-out infinite">🌱</div>
        <div style="font-size:26px">เส้นทางชีวิต</div>
        <div style="width:160px;height:6px;border-radius:9px;background:rgba(90,52,67,.12);overflow:hidden"><div style="width:40%;height:100%;border-radius:9px;background:#e0707f;animation:lp-bar 1.1s ease-in-out infinite"></div></div>
        <div style="font-size:14px;color:#8a6a76">กำลังเตรียมชีวิตใหม่...</div>
      </div>
      <style>@keyframes lp-bob{50%{transform:translateY(-8px)}}@keyframes lp-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
